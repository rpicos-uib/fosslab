# FOSSLab configuration (bash syntax).
# Installed as /etc/fosslab.conf and read by every FOSSLab command.
# Variables marked (install) are only used by the install scripts.

# Where FOSSLab lives (programs, the container image, KLayout macros).
FOSSLAB_PREFIX=/opt/fosslab

# How tools run: apptainer (recommended on SL7) or podman.
FOSSLAB_RUNTIME=apptainer

# IIC-OSIC-TOOLS version: docker.io/hpretl/iic-osic-tools:<tag>.
# FOSSLab was tested with 2026.07 (xschem 3.4.8RC, KLayout 0.30.9,
# ngspice-46, Magic 8.3.678, IHP SG13G2 PDK as shipped in the image).
FOSSLAB_IMAGE_TAG=2026.07
FOSSLAB_IMAGE=/opt/fosslab/images/iic-osic-tools_2026.07.sif

# Host folders visible inside the container (space separated, src[:dst]).
# /home is needed so the supervisor can browse the students' workspaces.
FOSSLAB_BINDS="/home"

# Unix groups: students, and the teachers who supervise them.
FOSSLAB_STUDENT_GROUP=fosslab
FOSSLAB_STAFF_GROUP=fosslab-staff

# Each user's workspace is ~/$FOSSLAB_WS_NAME.
FOSSLAB_WS_NAME=fosslab

# What teachers may do in a student's workspace: rX (read) or rwX (read+write).
FOSSLAB_ACL_MODE=rX

# Shown in Help > Tutorial.
FOSSLAB_TUTORIAL_URL=https://memristors.uib.es/index.php/education/fosslab/

# Text editor for Verilog-A, SPICE, notes (inside the container: gedit, vim, xterm -e vim).
FOSSLAB_EDITOR=gedit

# (install) Teachers' user names, space separated. They join FOSSLAB_STAFF_GROUP.
FOSSLAB_TEACHERS="rodrigo"

# (install) Install apptainer-suid (setuid starter). Recommended on EL7's
# 3.10 kernel, where unprivileged mounts of the image are not available.
FOSSLAB_APPTAINER_SUID=yes

# (install) If the EPEL package is not available, the Apptainer RPM to use.
FOSSLAB_APPTAINER_RPM_URL=""

# (install) Install an X2Go server and an XFCE desktop for remote logins.
FOSSLAB_INSTALL_X2GO=yes

# (install) Instead of building the image here (needs ~45 GB free and an
# hour), download a ready .sif built elsewhere with install/build_sif.sh.
FOSSLAB_SIF_URL=""
